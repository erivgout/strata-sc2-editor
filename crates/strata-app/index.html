<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Strata</title>
  <meta name="description" content="Strata: a fast StarCraft II map editor that runs in your browser, installs as an app, and runs natively.">
  <meta name="theme-color" content="#1B232D">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <link data-trunk rel="rust" data-bin="strata" data-wasm-opt="2" data-initializer="assets/initializer.js">
  <link data-trunk rel="copy-file" href="assets/manifest.webmanifest">
  <link data-trunk rel="copy-file" href="assets/sw.js">
  <link data-trunk rel="copy-dir" href="assets/icons">

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #131920; color: #DDE4EC;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }

    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      background: #1B232D;
      transition: opacity 240ms ease-out;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .card { display: grid; justify-items: center; gap: 14px; padding: 24px; max-width: 420px; text-align: center; }
    #loading svg { width: 72px; height: 72px; }
    #loading .name { font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
    #loading .track { width: 220px; height: 3px; border-radius: 2px; background: #252F3B; overflow: hidden; }
    #loading .fill { height: 100%; width: 30%; border-radius: 2px; background: #62CDEB; animation: slide 1.1s ease-in-out infinite; }
    #loading.measured .fill { animation: none; transition: width 120ms linear; }
    #loading-status { color: #8A98A8; min-height: 1.4em; }
    #loading-detail { color: #8A98A8; font-size: 12px; font-family: ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
    #loading.failed .track { display: none; }
    #loading.failed #loading-status { color: #EC7078; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    @media (prefers-reduced-motion: reduce) { #loading .fill { animation: none; width: 100%; opacity: 0.5; } }
  </style>
</head>
<body>
  <canvas id="strata_canvas"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div class="card">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#131920"/>
        <g fill="none" stroke="#62CDEB" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
          <path d="M116 360 L268 360 L316 312 L396 312" stroke-opacity="0.38"/>
          <path d="M116 280 L212 280 L260 232 L396 232" stroke-opacity="0.68"/>
          <path d="M116 200 L156 200 L204 152 L396 152"/>
        </g>
      </svg>
      <div class="name">Strata</div>
      <div class="track"><div class="fill"></div></div>
      <div id="loading-status">Loading the editor…</div>
      <div id="loading-detail"></div>
    </div>
  </div>
  <noscript>
    <p style="position:fixed;inset:auto 0 24px;text-align:center;color:#EC7078">Strata needs JavaScript and WebAssembly. Turn on JavaScript and reload.</p>
  </noscript>

  <script>
    (function () {
      const loading = document.getElementById("loading");
      const status = document.getElementById("loading-status");
      window.strataLoadingFailed = function (message, detail) {
        loading.classList.add("failed");
        status.textContent = message;
        document.getElementById("loading-detail").textContent = detail || "";
      };

      // Strata renders with WebGL 2; say so up front instead of failing later.
      const probe = document.createElement("canvas");
      if (!probe.getContext("webgl2")) {
        window.strataLoadingFailed(
          "Strata needs WebGL 2, which this browser has turned off or does not support.",
          "Update your browser or turn on hardware acceleration in its settings, then reload."
        );
      }

      // Install as an app (PWA). Rust calls these through window.
      let installPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        installPrompt = e;
      });
      window.addEventListener("appinstalled", function () { installPrompt = null; });
      window.strataCanInstall = function () { return installPrompt !== null; };
      window.strataInstall = async function () {
        if (!installPrompt) return false;
        const p = installPrompt;
        installPrompt = null;
        p.prompt();
        const choice = await p.userChoice;
        return choice.outcome === "accepted";
      };

      // Reading the user's StarCraft II folder for base-game data (Rust:
      // game_data.rs). Files are read lazily, a byte range at a time, and
      // never leave the browser. Chrome/Edge use the File System Access
      // API; other browsers fall back to a folder input where available.
      const sc2 = { handle: null, files: null, dirs: new Map() };
      window.strataSc2Support = function () {
        if ("showDirectoryPicker" in window) return "picker";
        return "webkitdirectory" in document.createElement("input") ? "input" : "";
      };
      window.strataSc2Pick = function () {
        if ("showDirectoryPicker" in window) {
          return window.showDirectoryPicker({ id: "strata-sc2", mode: "read" }).then(function (h) {
            sc2.handle = h; sc2.files = null; sc2.dirs = new Map();
            sc2Remember(h);
            return h.name;
          }, function (e) {
            if (e && e.name === "AbortError") return null;
            throw String(e && e.message || e);
          });
        }
        return new Promise(function (resolve) {
          const input = document.createElement("input");
          input.type = "file";
          input.webkitdirectory = true;
          input.addEventListener("change", function () {
            const files = new Map();
            let root = null;
            for (const f of input.files) {
              const p = f.webkitRelativePath || f.name;
              const i = p.indexOf("/");
              root = root || p.slice(0, i);
              files.set(p.slice(i + 1).toLowerCase(), f);
            }
            sc2.handle = null; sc2.files = files;
            resolve(files.size ? root : null);
          });
          input.addEventListener("cancel", function () { resolve(null); });
          input.click();
        });
      };
      // The picked folder's handle is kept in IndexedDB so a later visit can
      // reopen it for game assets without asking, where the browser still
      // grants read access (Chrome/Edge "allow on every visit").
      function sc2Db() {
        return new Promise(function (resolve, reject) {
          const req = indexedDB.open("strata", 1);
          req.onupgradeneeded = function () { req.result.createObjectStore("handles"); };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      }
      function sc2Remember(h) {
        sc2Db().then(function (db) {
          db.transaction("handles", "readwrite").objectStore("handles").put(h, "sc2");
        }).catch(function () {});
      }
      window.strataSc2Restore = async function () {
        if (!("indexedDB" in window) || !("showDirectoryPicker" in window)) return null;
        const db = await sc2Db();
        const h = await new Promise(function (resolve) {
          const req = db.transaction("handles").objectStore("handles").get("sc2");
          req.onsuccess = function () { resolve(req.result || null); };
          req.onerror = function () { resolve(null); };
        });
        if (!h || !h.queryPermission) return null;
        if ((await h.queryPermission({ mode: "read" })) !== "granted") return null;
        sc2.handle = h; sc2.files = null; sc2.dirs = new Map();
        return h.name;
      };
      // Directory handle for a relative path, matching names case-insensitively.
      async function sc2Dir(parts) {
        let dir = sc2.handle;
        let key = "";
        for (const part of parts) {
          key += "/" + part.toLowerCase();
          let next = sc2.dirs.get(key);
          if (!next) {
            for await (const [name, h] of dir.entries()) {
              if (h.kind === "directory" && name.toLowerCase() === part.toLowerCase()) { next = h; break; }
            }
            if (!next) throw "no folder " + parts.join("/");
            sc2.dirs.set(key, next);
          }
          dir = next;
        }
        return dir;
      }
      async function sc2File(path) {
        if (sc2.files) {
          const f = sc2.files.get(path.toLowerCase());
          if (!f) throw "no file " + path;
          return f;
        }
        if (!sc2.handle) throw "no StarCraft II folder chosen";
        const parts = path.split("/");
        const name = parts.pop();
        const dir = await sc2Dir(parts);
        try {
          return await (await dir.getFileHandle(name)).getFile();
        } catch (e) {
          for await (const [n, h] of dir.entries()) {
            if (h.kind === "file" && n.toLowerCase() === name.toLowerCase()) return await h.getFile();
          }
          throw "no file " + path;
        }
      }
      window.strataSc2Read = async function (path, offset, len) {
        const file = await sc2File(path);
        const blob = len === null || len === undefined ? file.slice(offset) : file.slice(offset, offset + len);
        return new Uint8Array(await blob.arrayBuffer());
      };
      window.strataSc2List = async function (path) {
        const out = [];
        if (sc2.files) {
          const prefix = path.toLowerCase() + "/";
          for (const k of sc2.files.keys()) {
            if (k.startsWith(prefix) && k.indexOf("/", prefix.length) < 0) out.push(k.slice(prefix.length));
          }
          return out;
        }
        const dir = await sc2Dir(path.split("/").filter(Boolean));
        for await (const [name, h] of dir.entries()) if (h.kind === "file") out.push(name);
        return out;
      };

      // Service worker: offline support plus an "update ready" notice.
      let updateReady = false;
      window.strataUpdateReady = function () { return updateReady; };
      window.strataReload = function () { location.reload(); };
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        navigator.serviceWorker.addEventListener("message", function (e) {
          if (e.data && e.data.type === "strata-update-ready") updateReady = true;
        });
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function (err) {
            console.warn("Strata: offline support is unavailable:", err);
          });
        });
      }
    })();
  </script>
</body>
</html>
