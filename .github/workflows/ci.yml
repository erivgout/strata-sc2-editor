name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.1

# `cargo fmt --check` is not run yet: the workspace is not uniformly
# rustfmt-formatted. Add it once a rustfmt.toml is agreed and applied.

jobs:
  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # Advisory until the scaffold's dead-code warnings are gone.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check wasm32
        run: cargo check -p strata-app --target wasm32-unknown-unknown --locked
      - name: Install trunk
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          trunk --version
      - name: Build release bundle
        working-directory: crates/strata-app
        run: for i in 1 2 3 4; do trunk build --release && exit 0; echo "trunk build failed (attempt $i), retrying"; sleep 30; done; exit 1
      - name: Report bundle size
        working-directory: crates/strata-app/dist
        run: |
          ls -l *.wasm
          echo "gzipped: $(gzip -9 -c *.wasm | wc -c) bytes"
