name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install trunk
        run: curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
      - name: Build release bundle
        working-directory: crates/strata-app
        run: for i in 1 2 3 4; do trunk build --release && exit 0; echo "trunk build failed (attempt $i), retrying"; sleep 30; done; exit 1
      - name: Stamp the service worker version
        # A changed sw.js makes installed apps fetch the new version and
        # offer a reload.
        working-directory: crates/strata-app/dist
        run: sed -i "s/__STRATA_BUILD__/${GITHUB_SHA::12}/" sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/strata-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
