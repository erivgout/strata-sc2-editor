[workspace]
resolver = "2"
members = ["crates/strata-mpq", "crates/strata-casc", "crates/strata-core", "crates/strata-format", "crates/strata-app", "crates/strata-mcp", "crates/strata-dds"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
strata-mpq = { path = "crates/strata-mpq" }
strata-casc = { path = "crates/strata-casc" }
strata-core = { path = "crates/strata-core" }
strata-format = { path = "crates/strata-format" }
strata-dds = { path = "crates/strata-dds" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = "0.38"
glam = { version = "0.30", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
